# VPS Docker behind a reverse proxy (nginx/Caddy). Not used on InfinityFree shared hosting.
#
# Binds Apache only on loopback: 127.0.0.1:8088 → container :80
# Public URL is still WP_HOME from .env (default https://magdyhelalcorp.infinityfree.io).
#
#   cp .env.example .env   # fill password placeholders
#   docker compose -f docker-compose.server.yml up -d
#
# An InfinityFree *.infinityfree.io subdomain does not point at your VPS unless you
# control DNS for a custom domain. Setting WP_HOME to the InfinityFree host while
# this stack runs on a VPS will not make that hostname resolve here.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-magdi_hilal}
      MYSQL_USER: ${MYSQL_USER:-magdi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-magdi}", "-p${MYSQL_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-magdi}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-magdi_hilal}
      WORDPRESS_TABLE_PREFIX: mha_
      MHA_SYNC_THEME: "0"
      MHA_OPENAI_API_KEY: ${MHA_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WP_HOME: ${WP_HOME:-https://magdyhelalcorp.infinityfree.io}
      WP_SITEURL: ${WP_SITEURL:-https://magdyhelalcorp.infinityfree.io}
      WP_URL: ${WP_URL:-https://magdyhelalcorp.infinityfree.io}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-momagdyy97@gmail.com}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PREFIX', 'mha:');
        define('WP_HOME', getenv('WP_HOME') ?: 'https://magdyhelalcorp.infinityfree.io');
        define('WP_SITEURL', getenv('WP_SITEURL') ?: 'https://magdyhelalcorp.infinityfree.io');
        define('FS_METHOD', 'direct');
        define('MYSQL_CLIENT_FLAGS', 0);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/magdi-hilal-adco:/var/www/html/wp-content/themes/magdi-hilal-adco
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  wpcli:
    image: wordpress:cli-php8.2
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/magdi-hilal-adco:/var/www/html/wp-content/themes/magdi-hilal-adco
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-magdi}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-magdi_hilal}
      WORDPRESS_TABLE_PREFIX: mha_
      WP_URL: ${WP_URL:-https://magdyhelalcorp.infinityfree.io}
      WP_HOME: ${WP_HOME:-https://magdyhelalcorp.infinityfree.io}
      WP_SITEURL: ${WP_SITEURL:-https://magdyhelalcorp.infinityfree.io}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-changeme}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-momagdyy97@gmail.com}
    depends_on:
      - wordpress
      - db
    user: "33:33"
    profiles:
      - tools

volumes:
  db_data:
  redis_data:
  wp_data:
