# Published image + MySQL + Redis (VPS / Docker Hub path).
# Public WordPress URL comes from WP_HOME / WP_SITEURL in .env — not from the container port.
#
#   cp .env.example .env   # fill password placeholders
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-magdi_hilal}
      MYSQL_USER: ${MYSQL_USER:-magdi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-magdi}", "-p${MYSQL_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: momousa1997/magdyhelalcorp:latest
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8088}:80"
    environment:
      MHA_SYNC_THEME: "1"
      MHA_OPENAI_API_KEY: ${MHA_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-magdi}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-magdi_hilal}
      WORDPRESS_TABLE_PREFIX: mha_
      WP_HOME: ${WP_HOME:-https://magdyhelalcorp.infinityfree.io}
      WP_SITEURL: ${WP_SITEURL:-https://magdyhelalcorp.infinityfree.io}
      WP_URL: ${WP_URL:-https://magdyhelalcorp.infinityfree.io}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-momagdyy97@gmail.com}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PREFIX', 'mha:');
        define('WP_HOME', getenv('WP_HOME') ?: 'https://magdyhelalcorp.infinityfree.io');
        define('WP_SITEURL', getenv('WP_SITEURL') ?: 'https://magdyhelalcorp.infinityfree.io');
        define('FS_METHOD', 'direct');
        define('MYSQL_CLIENT_FLAGS', 0);
    volumes:
      - wp_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  wp_data:
